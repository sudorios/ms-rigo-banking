server:
  port: 8082
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://config-server:8888
  data:
    mongodb:
      uri: mongodb://mongodb:27017/bank_accounts

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  kafka:
    bootstrap-servers: kafka:9092
